# Name of your application. Used to uniquely configure containers.
service: music_theory

# Name of the container image.
image: kquizz/music-theory

# Deploy to these servers.
servers:
  web:
    hosts:
      - 192.168.50.220

# Cloudflare terminates HTTPS; the tunnel speaks plain HTTP to kamal-proxy,
# so SSL is off here (do NOT enable force_ssl in production.rb).
proxy:
  ssl: false
  host: musictheory.kquizz.com

# Where you keep your container images.
registry:
  server: ghcr.io
  username: kquizz
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder. The homelab box is amd64; build for it.
builder:
  arch: amd64

# Use a different ssh user than root.
ssh:
  user: kquizz
